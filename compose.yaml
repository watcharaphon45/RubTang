services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rubtang
      POSTGRES_PASSWORD: rubtang_local_only
      POSTGRES_DB: rubtang
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubtang -d rubtang"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
